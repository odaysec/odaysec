name: Update Instagram Followers

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Instagram Followers
        run: |
          RESPONSE=$(curl -s 'https://www.pathsocial.com/wp-admin/admin-ajax.php' \
            -H 'Content-Type: application/x-www-form-urlencoded; charset=UTF-8' \
            -H 'X-Requested-With: XMLHttpRequest' \
            --data 'action=get_instagram_data_for_follower&account_handle=youryreborn')

          echo "$RESPONSE" > response.json

          # GANTI bagian ini sesuai struktur JSON API yang sebenarnya
          FOLLOWERS=$(jq -r '.followers // .data.followers // .count // "unknown"' response.json)

          cat > instagram-followers.json << EOF
          {
            "schemaVersion": 1,
            "label": "Instagram Followers",
            "message": "${FOLLOWERS}",
            "color": "E4405F"
          }
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add instagram-followers.json

          git diff --staged --quiet || git commit -m "chore: update instagram followers"

          git push
